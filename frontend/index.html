<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronost — Пользователи</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ── Header ── */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 20px 0;
        }

        .header-inner {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
        }

        .header p {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }

        /* ── Main ── */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 24px 60px;
        }

        /* ── Add User Form ── */
        .add-form {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .add-form label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-row input, .input-row select {
            flex: 1 1 160px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f0f1a;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-row input::placeholder {
            color: #555;
        }

        .input-row input:focus, .input-row select:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15);
        }

        .btn-add {
            flex: 1 1 auto;
            padding: 12px 24px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, opacity 0.2s;
            white-space: nowrap;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .btn-add:active {
            transform: translateY(0);
        }

        .btn-add:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ── Section title ── */
        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title h2 {
            font-size: 16px;
            font-weight: 600;
            color: #ccc;
        }

        .user-count {
            font-size: 13px;
            color: #666;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ── User List ── */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            transition: border-color 0.2s, transform 0.15s;
            animation: slideIn 0.3s ease-out both;
        }

        .user-card:hover {
            border-color: rgba(108, 92, 231, 0.3);
            transform: translateX(4px);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 15px;
            font-weight: 500;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-id {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .btn-delete {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: transparent;
            color: #666;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-delete:hover {
            border-color: #e74c3c;
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
        }

        /* ── States ── */
        .empty-state, .loading-state, .error-state {
            text-align: center;
            padding: 48px 24px;
            border-radius: 16px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .empty-state .icon, .loading-state .icon, .error-state .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-state p, .loading-state p {
            color: #666;
            font-size: 14px;
        }

        .error-state p {
            color: #e74c3c;
            font-size: 14px;
        }

        .loading-state .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(108, 92, 231, 0.2);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: #1a3a2a;
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .toast.error {
            background: #3a1a1a;
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        /* ── Responsive ── */
        @media (max-width: 480px) {
            .input-row {
                flex-direction: column;
            }
            .btn-add {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-inner">
        <div class="logo">A</div>
        <div>
            <h1>Asynchronost</h1>
            <p>Управление пользователями и товарами</p>
        </div>
    </div>
</div>

<div class="container">
    <div class="add-form" id="auth-section">
        <label>Вход в систему</label>
        <div class="input-row">
            <input type="email" id="login-email" placeholder="Email…" autocomplete="off">
            <input type="password" id="login-password" placeholder="Пароль…" autocomplete="off">
            <button class="btn-add" id="login-btn">Войти</button>
            <button class="btn-add" id="logout-btn" style="display: none; background: #e74c3c;">Выйти</button>
        </div>
        <div id="auth-status" style="margin-top: 10px; font-size: 13px; color: #4ade80; display: none;">Вы авторизованы</div>
    </div>
    <div class="add-form">
        <label>Регистрация (Новый пользователь)</label>
        <div class="input-row">
            <input type="text" id="new-user-name" placeholder="Имя…" autocomplete="off">
            <input type="text" id="new-user-surname" placeholder="Фамилия…" autocomplete="off">
            <input type="email" id="new-user-email" placeholder="Email…" autocomplete="off">
            <input type="password" id="new-user-password" placeholder="Пароль…" autocomplete="off">
            <input type="number" id="new-user-age" placeholder="Возраст…" autocomplete="off" min="12" style="flex: 0 1 100px;">
            <button class="btn-add" id="add-user-btn">Зарегистрироваться</button>
        </div>
    </div>

    <div class="section-title">
        <h2>Пользователи</h2>
        <span class="user-count" id="user-count"></span>
    </div>

    <div id="user-list" class="user-list"></div>

    <br><br>

    <div class="add-form">
        <label>Новый товар</label>
        <div class="input-row">
            <input type="text" id="new-product-name" placeholder="Название товара…" autocomplete="off">
            <input type="number" id="new-product-price" placeholder="Цена…" autocomplete="off">
            <input type="number" id="new-product-amount" placeholder="Количество…" autocomplete="off">
            <select id="new-product-user">
                <option value="">Выберите пользователя...</option>
            </select>
            <button class="btn-add" id="add-product-btn">Добавить</button>
        </div>
    </div>

    <div class="section-title">
        <h2>Товары</h2>
        <span class="user-count" id="product-count"></span>
    </div>

    <div id="product-list" class="user-list"></div>

    <br><br>

    <div class="add-form">
        <label>Новый каталог</label>
        <div class="input-row">
            <input type="text" id="new-catalogue-name" placeholder="Название каталога…" autocomplete="off">
            <button class="btn-add" id="add-catalogue-btn">Добавить</button>
        </div>
    </div>

    <div class="section-title">
        <h2>Каталоги</h2>
        <span class="user-count" id="catalogue-count"></span>
    </div>

    <div id="catalogue-list" class="user-list"></div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
